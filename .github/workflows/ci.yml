name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Test (unit)
        run: uv run pytest -q
  # M5 评测门禁：需要真实数据仓库，CI 里仅在 main 分支 + 含数据时跑（条件触发）
  eval-gate:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --dev
      - name: Build warehouse (CI fixture)
        run: |
          # CI 环境无 akshare 网络，写一个最小离线 fixture 让评测可跑
          uv run python scripts/build_eval_fixture.py
      - name: Eval (golden set)
        run: uv run python scripts/eval_golden.py --strict
