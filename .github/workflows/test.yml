name: test

# 每次 push 与 PR 都要过这条线。
# 三关：lint → 单测 → 起真实服务跑端到端。
# 起服务这一步比 unit test 更值钱：能 catch "import 顺序错"、"entry-point 在打包后
# 找不到模块" 这种静态测试拼不出来的故障。

on:
  push:
    branches: [main, master, workbuddy/**]
  pull_request:
    branches: [main, master]

# 同时间同分支后到的 build cancel 掉前面排队的，节省 CI 分钟。
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff (src + tests, locked version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.3"
          enable-cache: true
      - name: uv sync (dev)
        run: uv sync --dev
      # 用项目锁定的 ruff 版本，避免 CI 独立装 ruff 造成规则漂移
      - run: uv run ruff check src tests

  test:
    name: pytest (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.3"
          enable-cache: true
      - name: uv sync
        run: uv sync --all-extras
      - name: pytest
        run: uv run pytest --tb=short -rfE 2>&1 | tail -80
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  smoke:
    # 端到端：把 findata-serve 真实起在 8080，curl 三个关键路由，
    # 都拿到 200 + 期望字段才放过。能抓出 import / 路由挂载 / entry-point
    # 在干净 venv 下崩的问题。
    name: e2e smoke (serve up)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.3"
          enable-cache: true
      - name: uv sync
        run: uv sync --all-extras
      - name: start uvicorn (background)
        run: |
          set -e
          uv run uvicorn findata.cli.serve:app --host 127.0.0.1 --port 8080 >/tmp/serve.log 2>&1 &
          echo $! > /tmp/serve.pid
      - name: wait for /healthz
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/healthz || echo 000)
            if [ "$code" = "200" ]; then echo "ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "service never came up"; cat /tmp/serve.log; exit 1
      - name: hit core routes
        # 修法：FastAPI 默认 JSON 用紧凑格式（无空格），所以 grep 要写
        # '"ok":true' 而不是 '"ok": true'。同样原因下 .py / yaml 里的硬
        # 编码期望要保持一致；用 jq 更稳，但 CI runner 不一定有 jq，
        # 所以收紧 grep pattern 才是最小修法。
        run: |
          set -e
          # 1) 演示站
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = "200"
          # 2) 健康检查 (FastAPI JSON 紧凑: "ok":true)
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"ok":true'
          # 3) 巡检路由 - 用 synthetic 跑出可断言的告警
          payload=$(curl -fsS -X POST -H 'content-type: application/json' \
                       -d '{"source":"synthetic","seed":20240102}' \
                       http://127.0.0.1:8080/v1/inspect)
          echo "$payload" | python3 scripts/ci_assert_inspect.py
          # 4) 看板必须吐 HTML（且包含 findata-summary 这个 meta，是演示站依赖的）
          html=$(curl -fsS 'http://127.0.0.1:8080/v1/dashboard?source=synthetic&days=10')
          echo "$html" | grep -q 'name="findata-summary"'
          echo "$html" | grep -q '数据质量看板'
      - name: dump server log on exit
        if: always()
        run: cat /tmp/serve.log || true
      - name: kill server
        if: always()
        run: kill "$(cat /tmp/serve.pid)" 2>/dev/null || true

  eval-gate:
    # 评测门禁（离线）：合成 fixture 上跑 golden set（语义层数值/单位/验证状态断言）
    # + 归因层质量下限（召回/精确/抑制）。语义层回归或归因变差，这里直接红——
    # 评测不是文档里的口号，是挡 merge 的关卡。
    name: eval-gate (golden + quality)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.3"
          enable-cache: true
      - name: uv sync
        run: uv sync --all-extras
      - name: build eval fixture (synthetic, offline)
        run: uv run python scripts/build_eval_fixture.py
      - name: golden set gate (semantic layer)
        run: uv run python scripts/eval_golden.py --strict --db data/eval_fixture.duckdb
      - name: dq quality gate (attribution layer)
        run: >-
          uv run python scripts/run_eval.py
          --min-recall 0.9 --min-precision 0.9 --min-suppression 0.9

  ci-gate:
    # 聚合点：lint + 两侧 python + smoke + eval-gate 全过才让这条线变绿。
    # PR 列表上不再同时显示 5 条绿，避免 reviewer 视觉疲劳。
    name: ci-gate
    needs: [lint, test, smoke, eval-gate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: summary
        env:
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.test.result }}
          SMOKE: ${{ needs.smoke.result }}
          EVAL: ${{ needs.eval-gate.result }}
        run: |
          if [ "$LINT" != "success" ] || [ "$TESTS" != "success" ] || [ "$SMOKE" != "success" ] || [ "$EVAL" != "success" ]; then
            echo "ci-gate failing: lint=$LINT tests=$TESTS smoke=$SMOKE eval=$EVAL"
            exit 1
          fi
          echo "all green"
