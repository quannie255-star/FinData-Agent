  naive_sql: SELECT date, close FROM stock_daily WHERE symbol = '688981' AND date <= DATE '2025-09-04'
    ORDER BY date DESC LIMIT 1
  naive_result:
    value: 114.76
    as_of: '2025-08-29'
    unit: 元
  truth:
    suspended_from: '2025-09-01'
    suspended_to: '2025-09-08'
    returned_as_of: '2025-08-29'
