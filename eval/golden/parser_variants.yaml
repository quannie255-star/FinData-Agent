# 解析层长尾问法题集（parser variants）
#
# **为什么必须有这一份**：
# TrustBench 的 17 个问句是脚本按模板生成的，而规则解析的正则就是照着
# 那套模板写的。拿它们证明「规则解析不比 LLM 差」是自己送分——评测不许
# 给基线送分，这是本项目从 v0.7.1 修假满分时就立下的规矩。
#
# 这一组专挑规则词表覆盖不到的说法：
#   · intent 同义表述（「表现如何」「单日成交均值」不在规则词表里）
#   · 中文数字日期、量词「号」而非「日」
# 同时也留两道哨兵题（pv-03 / pv-06）——规则本来就该答对的，用来确认
# LLM 没把对的改错。只统计赢的那组是选择性取样。
#
# golden 参数与主集同源（同标的同区间），答案与徽章均可复现。
name: parser_variants
version: 0.1.0
description: 长尾问法：同一 golden 参数的不同说法，用于区分规则解析与 LLM 解析
generated_by: 人工编写（规则解析的已知盲区）
cases:
- id: pv-01
  question: 中芯国际 2025 年 8 月 29 日到 9 月 12 日的表现如何？
  symbol: '688981'
  intent: change
  params:
    start: '2025-08-29'
    end: '2025-09-12'
  note: 「表现」不在规则 intent 词表里，规则会默认成 price
- id: pv-02
  question: 中国神华 2025 年 8 月单日成交均值是多少？
  symbol: '601088'
  intent: aggregate
  params:
    start: '2025-08-01'
    end: '2025-08-31'
  note: 「单日成交均值」不在词表（「日均」「平均」才在），规则会默认成 price
- id: pv-03
  question: 贵州茅台 2025 年 9 月 15 日收于什么价位？
  symbol: '600519'
  intent: price
  params:
    as_of: '2025-09-15'
  note: 哨兵题——规则解析本来就该答对，用来确认 LLM 没把对的改错
- id: pv-04
  question: 二〇二五年九月四日中芯国际的收盘价是多少？
  symbol: '688981'
  intent: price
  params:
    as_of: '2025-09-04'
  note: 中文数字日期，规则正则只认阿拉伯数字
- id: pv-05
  question: 中芯国际 2025 年 9 月 4 号收盘多少？
  symbol: '688981'
  intent: price
  params:
    as_of: '2025-09-04'
  note: 量词是「号」不是「日」，规则会退化成整月区间（as_of 缺失 → 解析失败）
- id: pv-06
  question: 中信证券 2022 年 1 月 19 日至 1 月 27 日期间涨跌幅
  symbol: '600030'
  intent: change
  params:
    start: '2022-01-19'
    end: '2022-01-27'
  note: 哨兵题——连接词是「至」不是「到」，规则只看日期本身，应仍答对
- id: pv-07
  question: 贵州茅台 2025 年 9 月的收盘价是多少？
  symbol: '600519'
  intent: price
  refuse: true
  params: {}
  note: >
    应拒绝题。「9 月的收盘价」这个前提本身不成立——一个月没有"这一天"。
    正确行为是报错拒绝；若模型随手编一个日期（如 9 月 4 日）并照常返回数字，
    那就是**静默错**：槽位是完整的，只是值是编的，完整性校验查不出来。
    这类失败最危险，因为它看起来一切正常。
