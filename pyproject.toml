[project]
name = "findata"
version = "2.2.0"
description = "Findata 可信数据增强模块：挂到成熟 Agent 项目上的四档可信徽章（MCP/HTTP trust 接口）+ 任意数据表的带徽章可信报告（通用包）+ A 股领域包（探针-归因-抑制-可信日报）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "akshare>=1.14",
    "pandas>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.31",
    "pyyaml>=6.0.3",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "mcp>=2.1.1",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "langgraph>=1.2.11",
    "langchain-openai>=1.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
evolve = [
    "dspy>=3.3.1",
    "gepa>=0.1.4",
]
# M14 RL 管线的可选依赖：JSONL 导出零依赖可跑，parquet 导出（verl 直连）需要 pyarrow。
# 训练侧（agentlightning / verl / torch）是 GPU 机器上的独立环境，不进本项目依赖。
rl = [
    "pyarrow>=15.0",
]

[build-system]
# 不用 hatchling —— hatchling 的 PEP 660 editable install 走 `editables`
# 包，slim docker 容器内 PyPI 拉 editables 经常失败（多轮 release 都
# 撞这一处）。改用 setuptools 68+ 自带的 PEP 660 实现（_vendor 路径），
# 不需要 editables 任何外部 build dep。
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["findata*"]

[project.scripts]
findata-api = "findata.api.app:main"
findata-mcp = "findata.mcp.server:main"
findata-serve = "findata.cli.serve:main"
findata-trust-report = "findata.cli.trust_report:main"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# llm_triage 的 prompt 模板须与 eval/prompts/ 版本档案逐字节一致（可回滚可
# 对比），折行会破坏一致性，因此豁免行宽。
"src/findata/agent/llm_triage.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
