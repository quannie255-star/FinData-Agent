[project]
name = "findata"
version = "2.2.0"
description = "Findata 可信数据增强模块：挂到成熟 Agent 项目上的四档可信徽章（MCP/HTTP trust 接口）+ 任意数据表的带徽章可信报告（通用包）+ A 股领域包（探针-归因-抑制-可信日报）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "akshare>=1.14",
    "pandas>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.31",
    "pyyaml>=6.0.3",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "mcp>=2.1.1",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "langgraph>=1.2.11",
    "langchain-openai>=1.6.0",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
# D1 扫描件 OCR 兜底：图片型 PDF 提取。默认安装（不带 extra 的 uv sync）不装；
# 本机产品化启用：uv sync --extra ocr。⚠️注意 CI 的 test/smoke/eval-gate 用
# `uv sync --all-extras`——这两个 extra 在 CI 会装上（真模型用例因此会执行，
# 未装时走 skip，收集数不变）。
ocr = [
    "rapidocr-onnxruntime>=1.4.0",
]
# L2 混合检索：本机 CPU 向量推理（ONNX，文本不出本机；产品口径，
# 赛题口径评测线不用）。默认安装不装；本机启用：uv sync --extra embed；
# CI 同上面 ocr——`--all-extras` 会装。
embed = [
    "fastembed>=0.3.6",
]

[dependency-groups]
dev = [
    "huggingface-hub>=1.31.0",
    "pytest>=8.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.5",
]
evolve = [
    "dspy>=3.3.1",
    "gepa>=0.1.4",
]
# M14 RL 管线的可选依赖：JSONL 导出零依赖可跑，parquet 导出（verl 直连）需要 pyarrow。
# 训练侧（agentlightning / verl / torch）是 GPU 机器上的独立环境，不进本项目依赖。
rl = [
    "pyarrow>=15.0",
]

[build-system]
# 不用 hatchling —— hatchling 的 PEP 660 editable install 走 `editables`
# 包，slim docker 容器内 PyPI 拉 editables 经常失败（多轮 release 都
# 撞这一处）。改用 setuptools 68+ 自带的 PEP 660 实现（_vendor 路径），
# 不需要 editables 任何外部 build dep。
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["findata*"]

[project.scripts]
findata-api = "findata.api.app:main"
findata-mcp = "findata.mcp.server:main"
findata-serve = "findata.cli.serve:main"
findata-trust-report = "findata.cli.trust_report:main"
findata-context-economist = "findata.economist.cli:main"
findata-finqa-app = "findata.finqa.service:main"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# llm_triage 的 prompt 模板须与 eval/prompts/ 版本档案逐字节一致（可回滚可
# 对比），折行会破坏一致性，因此豁免行宽。
"src/findata/agent/llm_triage.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
