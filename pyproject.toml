[project]
name = "findata"
version = "0.5.0"
description = "数据质量监控 Agent：异常探测 + 根因归因 + 误报抑制 + 评测门禁"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "akshare>=1.14",
    "pandas>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.31",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "mcp>=2.1.1",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
# 不用 hatchling —— hatchling 的 PEP 660 editable install 走 `editables`
# 包，slim docker 容器内 PyPI 拉 editables 经常失败（多轮 release 都
# 撞这一处）。改用 setuptools 68+ 自带的 PEP 660 实现（_vendor 路径），
# 不需要 editables 任何外部 build dep。
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["findata*"]

[project.scripts]
findata-api = "findata.api.app:app"
findata-mcp = "findata.mcp.server:main"
findata-serve = "findata.cli.serve:main"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
